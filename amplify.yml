version: 1
applications:
  - appRoot: CRM
    backend:
      phases:
        build:
          commands:
            - npm ci
            # Deploys CRM/amplify (auth, tables, storage, functions) and writes amplify_outputs.json.
            # Skipped on branches that don't have the amplify/ folder yet.
            - if [ -d amplify ]; then npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID; fi
    frontend:
      phases:
        build:
          commands:
            - node scripts/write-runtime-env.mjs
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
          - .next/cache/**/*
